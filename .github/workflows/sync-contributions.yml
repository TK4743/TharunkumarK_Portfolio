name: Sync GitHub Contributions

on:
  schedule:
    # Runs daily at 01:00 UTC (06:30 IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write # Required to commit & push updated data files

jobs:
  sync:
    name: Sync Contribution Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run contribution sync script
        run: node scripts/sync-contributions.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/contributionData.ts public/contribution-chart.svg || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated contribution data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/contributionData.ts public/contribution-chart.svg
          git commit -m "chore: sync GitHub contributions [$(date -u '+%Y-%m-%d')]"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "No contribution changes detected. Skipping commit."
